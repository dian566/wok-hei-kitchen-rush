<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOK HEI! — Midnight Kitchen Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17100b; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: #241610; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720" aria-label="WOK HEI! Midnight Kitchen Rush: a timed cooking game. Click ingredients to build dishes, cook them in the wok, and serve matching orders before customers lose patience."></canvas></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
